<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open-source English / Chinese resume generator. 开源中英文简历生成器，浏览器内编辑，一键导出 PDF。" />
    <title>Resume EN/中 · 中英文简历生成器</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="page-style"></style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand" title="Resume EN/中"><img src="/src/logo.png" alt="Resume EN/中" width="32" height="32" /></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tpl="en" data-i18n-title="tplEnHint"><span data-i18n="tplEn"></span></button>
        <button type="button" role="tab" data-tpl="zh" data-i18n-title="tplZhHint"><span data-i18n="tplZh"></span></button>
      </div>
      <label class="size"><span data-i18n="template"></span>
        <select id="template"></select>
      </label>
      <label class="size"><span data-i18n="pageSize"></span>
        <select id="page-size"><option value="letter">Letter</option><option value="a4">A4</option></select>
      </label>
      <div class="spacer"></div>
      <label class="btn ghost"><span data-i18n="importJson"></span><input id="import-file" type="file" accept="application/json,.json" hidden /></label>
      <button type="button" class="btn ghost" id="export" data-i18n="exportJson"></button>
      <button type="button" class="btn ghost" id="reset" data-i18n="reset"></button>
      <button type="button" class="btn ghost ui-lang" id="ui-lang" title="界面语言 / UI language"></button>
      <button type="button" class="btn primary" id="download" data-i18n-title="printTip"><span data-i18n="download"></span></button>
    </header>
    <main class="layout">
      <aside id="editor" class="editor" aria-label="Editor"></aside>
      <section id="stage" class="stage">
        <div class="page-wrap"><div id="page" class="page"></div></div>
        <p class="hint"><span data-i18n="printTip"></span> · <span data-i18n="saved"></span> · <a href="https://github.com/2Anblo/resume-en-ch" target="_blank" rel="noopener" data-i18n="source"></a></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
